name: Build Expo IPA
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo prebuild --platform ios --clean --no-install
        env:
          CI: "1"
      - run: npx pod-install
        working-directory: ios
      - run: |
          xcodebuild -workspace StickerSmash.xcworkspace \
            -scheme StickerSmash \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build
        working-directory: ios
      - run: |
          cd build/Build/Products/Release-iphoneos
          test -d StickerSmash.app || { echo "ERROR: StickerSmash.app was not built"; exit 1; }
          mkdir -p Payload
          cp -r StickerSmash.app Payload/
          rm -f StickerSmash.ipa
          zip -r StickerSmash.ipa Payload -x "*.DS_Store"
          unzip -l StickerSmash.ipa
          unzip -l StickerSmash.ipa | grep -q "Payload/StickerSmash.app/" || { echo "ERROR: .ipa is missing Payload/StickerSmash.app"; exit 1; }
        working-directory: ios
      - uses: actions/upload-artifact@v4
        with:
          name: StickerSmash.ipa
          path: ios/build/Build/Products/Release-iphoneos/StickerSmash.ipa